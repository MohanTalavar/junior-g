#Tomcat server port number 8080
server.port=8080
#context path default value : empty
#server.servlet.context-path=/ems
server.servlet.session.persistent=false

# DB properties using EC2 env var
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA properties
spring.jpa.show-sql = true
spring.jpa.hibernate.ddl-auto = update
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL8Dialect

# Email  using EC2 env
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Notification client
notification.service.url=http://localhost:8081

# Actuator

management.endpoints.web.exposure.include=health,info,metrics,env,beans,loggers,threaddump,heapdump,mappings
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

# Enable info properties exposure
management.info.env.enabled=true

info.app.name=Junior G International Preschool
info.app.description=Backend APIs for Junior G Preschool System
info.app.version=1.4.1
# suppress inspection "SpellCheckingInspection"
info.app.owner=Mohan Talavar
info.app.environment=Production

# Logging Configuration
# Enable detailed Hibernate logs
#logging.level.org.springframework.orm.hibernate5=DEBUG
# Enable detailed Spring framework logs
#logging.level.org.springframework=DEBUG
# Enable Hibernate-level debugging
#logging.level.org.hibernate=DEBUG

# Spring MVC ViewResolver related
#spring.mvc.view.prefix=/WEB-INF/views
#spring.mvc.view.suffix=.jsp
#Disable open session in view
spring.jpa.open-in-view=false
#property to disable hibernateLazyInitializer during initialized proxies
